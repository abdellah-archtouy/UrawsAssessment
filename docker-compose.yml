services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: youraws-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userdb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # Backend API
  backend:
    image: aarchtou/youraws-backend:latest
    container_name: youraws-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/userdb
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: "*"
    networks:
      - app-network

  # Frontend (React SPA)
  frontend:
    image: aarchtou/youraws-frontend:latest
    container_name: youraws-frontend
    restart: unless-stopped
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/etc/letsencrypt/live:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
