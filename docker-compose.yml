version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: youraws-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Backend API
  backend:
    image: aarchtou/youraws-backend:latest
    container_name: youraws-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://appuser:apppass@mysql:3306/userdb?sslmode=disable
      PORT: 5000
      NODE_ENV: production
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (React)
  frontend:
    image: aarchtou/youraws-frontend:latest
    container_name: youraws-frontend
    restart: unless-stopped
    networks:
      - app-network

  # Nginx (HTTPS reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: youraws-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  # Certbot for HTTPS
  certbot:
    image: certbot/certbot
    container_name: youraws-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot \
      --email admin@aarchtou.me --agree-tos --no-eff-email \
      -d aarchtou.me -d www.aarchtou.me

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
