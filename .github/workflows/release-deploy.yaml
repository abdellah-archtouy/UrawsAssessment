name: Simple CI/CD Pipeline
on:
  push:
    branches: [release]
    paths: [deploy-trigger.txt]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get Main SHA
      id: sha
      run: |
        SHA=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1 | head -c 8)
        echo "sha=$SHA" >> $GITHUB_OUTPUT
    
    - name: Checkout Code
      run: |
        # Clone main branch for app code
        git clone --branch main --depth 1 https://github.com/${{ github.repository }} main-code
        
        # Clone release branch for scripts
        git clone --branch release --depth 1 https://github.com/${{ github.repository }} release-scripts
        
        echo "📁 Main code structure:"
        ls -la main-code/
        
        echo "📁 Release scripts structure:"
        ls -la release-scripts/
    
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'us-east-1'
    
    - name: Execute Deployment
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        MAIN_SHA: ${{ steps.sha.outputs.sha }}
      run: |
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        
        echo "🚀 Deploying with SHA: $MAIN_SHA"
        
        # Create the complete deployment script
        cat > /tmp/deploy.sh << 'COMPLETE_DEPLOY'
        #!/bin/bash
        set -e

        TIMESTAMP="$1"
        MAIN_SHA="$2"
        RELEASE_DIR="/home/ubuntu/myapp"

        echo "=== DEPLOYMENT START ==="
        echo "Time: $TIMESTAMP"
        echo "Image tag: $MAIN_SHA"
        echo ""

        # Stop old containers
        echo "🛑 Stopping old containers..."
        cd /home/ubuntu/myapp 2>/dev/null && docker-compose down || true

        # Update docker-compose.yml with new image tags
        echo "📝 Updating docker-compose.yml..."
        if [ ! -f "/home/ubuntu/myapp/docker-compose.yml" ]; then
          mkdir -p /home/ubuntu/myapp
        fi

        # Create/update docker-compose.yml with new image tags
        cat > /home/ubuntu/myapp/docker-compose.yml << 'DOCKER_COMPOSE'
        version: '3.8'

        services:
          mysql:
            image: mysql:8.0
            container_name: youraws-mysql
            restart: unless-stopped
            environment:
              MYSQL_ROOT_PASSWORD: rootpassword
              MYSQL_DATABASE: userdb
            volumes:
              - mysql_data:/var/lib/mysql
            networks:
              - app-network
            healthcheck:
              test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
              timeout: 20s
              retries: 10

          backend:
            image: aarchtou/youraws-backend:$MAIN_SHA
            container_name: youraws-backend
            restart: unless-stopped
            depends_on:
              mysql:
                condition: service_healthy
            environment:
              DATABASE_URL: mysql://root:rootpassword@mysql:3306/userdb
              PORT: 5000
              NODE_ENV: production
              CORS_ORIGIN: "*"
            networks:
              - app-network
            healthcheck:
              test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
              interval: 30s
              timeout: 10s
              retries: 3

          frontend:
            image: aarchtou/youraws-frontend:$MAIN_SHA
            container_name: youraws-frontend
            restart: unless-stopped
            networks:
              - app-network

          nginx:
            image: nginx:alpine
            container_name: youraws-nginx
            restart: unless-stopped
            ports:
              - "80:80"
            volumes:
              - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            depends_on:
              - frontend
              - backend
            networks:
              - app-network

        networks:
          app-network:
            driver: bridge

        volumes:
          mysql_data:
            driver: local
        DOCKER_COMPOSE

        echo "✅ Created docker-compose.yml with image tag: $MAIN_SHA"

        # Pull new images
        echo "⬇️ Pulling Docker images..."
        cd /home/ubuntu/myapp
        docker-compose pull || echo "⚠️ Some images may not exist yet"

        # Start containers
        echo "▶️ Starting containers..."
        docker-compose up -d

        # Verify
        echo "🔍 Verifying deployment..."
        sleep 15
        docker ps
        curl -s http://localhost/health && echo "✅ Health check passed" || echo "⚠️ Health check failed"

        echo ""
        echo "🎉 DEPLOYMENT COMPLETE!"
        echo "Image tag: $MAIN_SHA"
        echo "Time: $(date)"
        COMPLETE_DEPLOY

        # Send to EC2 and execute
        aws ssm send-command \
          --instance-ids $INSTANCE_ID \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "cd /tmp",
            "cat > deploy.sh << \"EOF\"",
            "'"$(cat /tmp/deploy.sh | sed 's/"/\\"/g')"'",
            "EOF",
            "chmod +x deploy.sh",
            "./deploy.sh \"'$TIMESTAMP'\" \"'$MAIN_SHA'\""
          ]'
        
        echo "✅ Deployment executed on EC2"