name: Release Branch Deployment Pipeline
on:
  push:
    branches:
      - release
    paths:
      - 'deploy-trigger.txt'

env:
  DOCKERHUB_USERNAME: 'aarchtou'
  AWS_REGION: 'us-east-1'

jobs:
  # JOB 1: Get Main Branch Info & Safety Check
  prepare:
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.get-sha.outputs.sha }}
      safe_to_deploy: ${{ steps.safety-check.outputs.safe }}
    
    steps:
    - name: Checkout Release Branch
      uses: actions/checkout@v4
      with:
        ref: release
    
    - name: Get Main Branch Commit SHA
      id: get-sha
      run: |
        echo "📦 Getting latest main branch commit..."
        MAIN_SHA=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
        SHORT_SHA=${MAIN_SHA:0:8}
        echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "✅ Main branch SHA: $SHORT_SHA"
    
    - name: Check Safety Lock
      id: safety-check
      run: |
        if [ "${{ secrets.SAFETY_LOCK_ENABLED || 'true' }}" = "true" ]; then
          echo "🔒 SAFETY LOCK ENABLED - Deployment blocked"
          echo "::warning::To deploy, set SAFETY_LOCK_ENABLED=false in GitHub Secrets"
          echo "safe=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Safety lock disabled - Ready for deployment"
          echo "safe=true" >> $GITHUB_OUTPUT
        fi

  # JOB 2: Build Docker Images
  build:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.safe_to_deploy == 'true'
    
    steps:
    - name: Checkout Main Branch
      uses: actions/checkout@v4
      with:
        ref: main
    
    - name: Build Backend Image
      run: |
        echo "🔨 Building backend image..."
        cd backend
        docker build -t ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:${{ needs.prepare.outputs.main_sha }} .
        echo "✅ Backend image built"
    
    - name: Build Frontend Image
      run: |
        echo "🔨 Building frontend image..."
        cd frontend
        docker build -t ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:${{ needs.prepare.outputs.main_sha }} .
        echo "✅ Frontend image built"
    
    - name: Push to Docker Hub (Optional)
      if: secrets.DOCKERHUB_TOKEN
      run: |
        echo "📤 Logging into Docker Hub..."
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
        
        echo "Pushing backend..."
        docker push ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:${{ needs.prepare.outputs.main_sha }}
        
        echo "Pushing frontend..."
        docker push ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:${{ needs.prepare.outputs.main_sha }}
        
        echo "✅ Images pushed to Docker Hub"

  # JOB 3: Find EC2 Instances & Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.safe_to_deploy == 'true'
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Find EC2 Instances
      id: find-instances
      run: |
        echo "🔍 Finding EC2 instances..."
        
        # Find instances by tag
        INSTANCE_IDS=$(aws ec2 describe-instances \
          --filters "Name=tag:Application,Values=uraws" \
                    "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].InstanceId" \
          --output text)
        
        if [ -z "$INSTANCE_IDS" ]; then
          echo "⚠️ No instances found with tag Application=uraws"
          echo "Looking for any instance with 'uraws' in the name..."
          
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --query "Reservations[].Instances[?Tags[?Key=='Name' && contains(Value, 'uraws')] && State.Name=='running'].InstanceId" \
            --output text)
        fi
        
        if [ -z "$INSTANCE_IDS" ]; then
          echo "❌ No EC2 instances found for deployment"
          echo "Please tag your instances with:"
          echo "  - Key: Application, Value: uraws"
          echo "  - OR have 'uraws' in the Name tag"
          exit 1
        fi
        
        echo "Found instances: $INSTANCE_IDS"
        echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
        
        COUNT=$(echo $INSTANCE_IDS | wc -w)
        echo "count=$COUNT" >> $GITHUB_OUTPUT
        
        echo "✅ Found $COUNT instance(s)"
    
    - name: Deploy to Each Instance
      env:
        MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
      run: |
        echo "🚀 Starting deployment..."
        
        for INSTANCE_ID in ${{ steps.find-instances.outputs.instance_ids }}; do
          echo ""
          echo "========================================"
          echo "Deploying to instance: $INSTANCE_ID"
          echo "========================================"
          
          # Create deployment script
          cat > deploy_script.sh << 'SCRIPTEOF'
          set -e
          #!/bin/bash

            echo "🚀 DEPLOYMENT STARTED"
            echo "====================="
            echo "Image Tag: $1"
            echo "Timestamp: $(date)"
            echo ""

            # Create or navigate to app directory
            mkdir -p /opt/uraws/nginx
            cd /opt/uraws

            echo "1. Updating docker-compose.yml with new image tags..."
            if [ -f "docker-compose.yml" ]; then
            cp docker-compose.yml docker-compose.backup.$(date +%Y%m%d-%H%M%S).yml
            echo "✅ Created backup"
            fi

            # Update image tags in docker-compose.yml
            sed -i "s|aarchtou/youraws-backend:latest|aarchtou/youraws-backend:$1|g" docker-compose.yml
            sed -i "s|aarchtou/youraws-frontend:latest|aarchtou/youraws-frontend:$1|g" docker-compose.yml

            echo "2. Pulling new Docker images..."
            docker-compose pull || {
            echo "❌ Failed to pull images"
            exit 1
            }

            echo "3. Stopping old containers..."
            docker-compose down || true

            echo "4. Starting new containers..."
            docker-compose up -d || {
            echo "❌ Failed to start containers"
            exit 1
            }

            echo "5. Waiting for containers to start..."
            sleep 15

            echo "6. Checking container status..."
            docker-compose ps

            echo "7. Cleaning up old images..."
            docker image prune -af 2>/dev/null || true

            echo ""
            echo "✅ DEPLOYMENT COMPLETED"
            echo "====================="
            echo "Deployed tag: $1"
            echo "Completed at: $(date)"
            SCRIPTEOF

          echo "📤 Sending deployment command to instance..."
          
          # Upload and execute deployment script
          SCRIPT_CONTENT=$(cat deploy_script.sh | sed 's/"/\\"/g')
          
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'cd /tmp',
              'cat > deploy.sh << \"DEPLOYEOF\"',
              '$SCRIPT_CONTENT',
              'DEPLOYEOF',
              'chmod +x deploy.sh',
              './deploy.sh \"$MAIN_SHA\"'
            ]" \
            --output text
          
          echo "✅ Deployment command sent to $INSTANCE_ID"
          
          # Wait between instances for staggered deployment
          if [ "${{ steps.find-instances.outputs.count }}" -gt 1 ]; then
            echo "⏳ Waiting 30 seconds before next instance..."
            sleep 30
          fi
        done
        
        echo ""
        echo "✅ Deployment initiated on all instances"

  # JOB 4: Verify Deployment
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Get Instance Public IPs
      id: get-ips
      run: |
        echo "🌐 Getting instance public IPs..."
        
        INSTANCE_IDS="${{ steps.find-instances.outputs.instance_ids }}"
        IP_LIST=""
        
        for INSTANCE_ID in $INSTANCE_IDS; do
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          
          if [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "None" ]; then
            echo "Instance $INSTANCE_ID: $PUBLIC_IP"
            IP_LIST="$IP_LIST $PUBLIC_IP"
          fi
        done
        
        echo "public_ips=$IP_LIST" >> $GITHUB_OUTPUT
    
    - name: Test Deployment
      if: steps.get-ips.outputs.public_ips
      env:
        PUBLIC_IPS: ${{ steps.get-ips.outputs.public_ips }}
      run: |
        echo "🔍 Testing deployment..."
        
        for IP in $PUBLIC_IPS; do
          echo ""
          echo "Testing instance: $IP"
          echo "===================="
          
          # Try health endpoint
          for i in {1..10}; do
            if curl -s -f "http://$IP/health" > /dev/null; then
              echo "✅ Health check passed on $IP"
              break
            else
              echo "Attempt $i/10: Health check failed, waiting 10s..."
              sleep 10
            fi
            
            if [ $i -eq 10 ]; then
              echo "⚠️ Health check failed on $IP after 10 attempts"
            fi
          done
        done
    
    - name: Success Summary
      if: success()
      run: |
        echo ""
        echo "🎉 DEPLOYMENT SUCCESSFUL!"
        echo "========================"
        echo "Deployed Commit: ${{ needs.prepare.outputs.main_sha }}"
        echo "Deployed Images:"
        echo "  Backend: aarchtou/youraws-backend:${{ needs.prepare.outputs.main_sha }}"
        echo "  Frontend: aarchtou/youraws-frontend:${{ needs.prepare.outputs.main_sha }}"
        echo "Deployed to: ${{ steps.find-instances.outputs.count }} instance(s)"
        
        if [ "${{ steps.get-ips.outputs.public_ips }}" ]; then
          echo ""
          echo "🌐 Access your application at:"
          for IP in ${{ steps.get-ips.outputs.public_ips }}; do
            echo "  http://$IP"
          done
        fi
        
        echo ""
        echo "📝 Manual Verification:"
        echo "To check deployment on an instance:"
        echo "  ssh -i your-key.pem ubuntu@EC2_IP"
        echo "  cd /opt/uraws"
        echo "  docker-compose ps"
        echo "  docker-compose logs"
    
    - name: Rollback Instructions
      if: failure()
      run: |
        echo ""
        echo "❌ DEPLOYMENT FAILED"
        echo "==================="
        echo ""
        echo "🔧 Manual Rollback Steps:"
        echo ""
        echo "1. SSH into each EC2 instance:"
        echo "   ssh -i your-key.pem ubuntu@EC2_IP"
        echo ""
        echo "2. Navigate to app directory:"
        echo "   cd /opt/uraws"
        echo ""
        echo "3. Restore from backup:"
        echo "   BACKUP=\$(ls -t docker-compose.backup.*.yml | head -1)"
        echo "   cp \"\$BACKUP\" docker-compose.yml"
        echo "   docker-compose down"
        echo "   docker-compose up -d"
        echo ""
        echo "4. Check status:"
        echo "   docker-compose ps"
        echo "   docker-compose logs"