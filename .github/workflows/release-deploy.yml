name: Simple Deployment Pipeline
on:
  push:
    branches: [release]
    paths: [deploy-trigger.txt]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Main Branch SHA
        id: sha
        run: |
          SHA=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1 | head -c 8)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "✅ Main SHA: $SHA"
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}
      
      - name: Deploy to EC2
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          MAIN_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/uraws",
              "sed -i \"s|aarchtou/youraws-backend:latest|aarchtou/youraws-backend:'"$MAIN_SHA"'|g\" docker-compose.yml",
              "sed -i \"s|aarchtou/youraws-frontend:latest|aarchtou/youraws-frontend:'"$MAIN_SHA"'|g\" docker-compose.yml",
              "docker compose pull",
              "docker compose down",
              "docker compose up -d",
              "echo Deployment complete"
            ]'