name: Release Branch Deployment Pipeline
on:
  push:
    branches:
      - release
    paths:
      - 'deploy-trigger.txt'

env:
  DOCKERHUB_USERNAME: 'aarchtou'
  DEPLOYMENT_ID: deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}
  AWS_REGION: 'us-east-1'

jobs:
  # JOB 1: Safety Validation
  safety-check:
    runs-on: ubuntu-latest
    outputs:
      safe_to_proceed: ${{ steps.check.outputs.safe }}
      main_branch_sha: ${{ steps.get-sha.outputs.sha }}
    
    steps:
    - name: Checkout Release Branch
      uses: actions/checkout@v4
      with:
        ref: release
    
    - name: Get Main Branch SHA
      id: get-sha
      run: |
        echo "📦 Fetching main branch info..."
        
        # Get the SHA of the latest commit on main branch
        MAIN_SHA=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
        
        if [ -z "$MAIN_SHA" ]; then
          echo "❌ Cannot fetch main branch SHA"
          exit 1
        fi
        
        SHORT_SHA=${MAIN_SHA:0:8}
        echo "main_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "✅ Main branch SHA: $SHORT_SHA"
    
    - name: Validate Safety Lock
      id: check
      env:
        SAFETY_LOCK: ${{ secrets.SAFETY_LOCK_ENABLED || 'true' }}
      run: |
        if [ "$SAFETY_LOCK" = "true" ]; then
          echo "🔒 SAFETY LOCK ENABLED"
          echo "::notice::To deploy, set SAFETY_LOCK_ENABLED=false in GitHub Secrets"
          echo "safe=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Safety lock disabled"
          echo "safe=true" >> $GITHUB_OUTPUT
        fi

  # JOB 2: Build Images from Main Branch
  build-images:
    runs-on: ubuntu-latest
    needs: safety-check
    if: needs.safety-check.outputs.safe_to_proceed == 'true'
    
    steps:
    - name: Checkout Main Branch (for building)
      uses: actions/checkout@v4
      with:
        ref: main
        path: ./app-code
    
    - name: Validate Docker Compose
      run: |
        echo "🔍 Validating infrastructure..."
        
        # Go to app-code directory where docker-compose.yml is
        cd app-code
        
        # Test that docker-compose is valid
        docker-compose config --quiet || {
          echo "❌ Invalid docker-compose.yml"
          exit 1
        }
        
        echo "✅ Docker Compose validation passed"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      continue-on-error: true
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and Push Backend
      env:
        IMAGE_TAG: ${{ needs.safety-check.outputs.main_branch_sha }}
      run: |
        echo "🔨 Building backend image..."
        
        cd app-code/backend
        
        # Build with main branch SHA as tag
        docker build -t ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:$IMAGE_TAG .
        docker tag ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:$IMAGE_TAG ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:latest
        
        if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "📤 Pushing to Docker Hub..."
          docker push ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:$IMAGE_TAG
          docker push ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:latest
          echo "✅ Backend image pushed: ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:$IMAGE_TAG"
        else
          echo "⚠️ No Docker Hub token, image built locally only"
          echo "✅ Backend image built: ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:$IMAGE_TAG"
        fi
    
    - name: Build and Push Frontend
      env:
        IMAGE_TAG: ${{ needs.safety-check.outputs.main_branch_sha }}
      run: |
        echo "🔨 Building frontend image..."
        
        cd app-code/frontend
        
        # Build with main branch SHA as tag
        docker build -t ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:$IMAGE_TAG .
        docker tag ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:$IMAGE_TAG ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:latest
        
        if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "📤 Pushing to Docker Hub..."
          docker push ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:$IMAGE_TAG
          docker push ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:latest
          echo "✅ Frontend image pushed: ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:$IMAGE_TAG"
        else
          echo "⚠️ No Docker Hub token, image built locally only"
          echo "✅ Frontend image built: ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:$IMAGE_TAG"
        fi
    
    - name: Generate Production Docker Compose
      run: |
        echo "📄 Generating production docker-compose.yml..."
        
        cd app-code
        
        cat > ../docker-compose.prod.yml << 'EOFMARKER'
        version: '3.8'
        
        services:
          mysql:
            image: mysql:8.0
            container_name: youraws-mysql
            restart: unless-stopped
            environment:
              MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
              MYSQL_DATABASE: userdb
            volumes:
              - mysql_data:/var/lib/mysql
            networks:
              - app-network
            healthcheck:
              test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
              timeout: 20s
              retries: 10
        
          backend:
            image: ${DOCKERHUB_USERNAME}/youraws-backend:${IMAGE_TAG}
            container_name: youraws-backend
            restart: unless-stopped
            depends_on:
              mysql:
                condition: service_healthy
            environment:
              DATABASE_URL: mysql://root:${DB_PASSWORD:-rootpassword}@mysql:3306/userdb
              PORT: 5000
              NODE_ENV: production
              CORS_ORIGIN: "*"
            networks:
              - app-network
            healthcheck:
              test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
              interval: 30s
              timeout: 10s
              retries: 3
        
          frontend:
            image: ${DOCKERHUB_USERNAME}/youraws-frontend:${IMAGE_TAG}
            container_name: youraws-frontend
            restart: unless-stopped
            networks:
              - app-network
        
          nginx:
            image: nginx:alpine
            container_name: youraws-nginx
            restart: unless-stopped
            ports:
              - "80:80"
            volumes:
              - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            depends_on:
              - frontend
              - backend
            networks:
              - app-network
        
        networks:
          app-network:
            driver: bridge
        
        volumes:
          mysql_data:
            driver: local
        EOFMARKER
        
        sed -i "s/\${DOCKERHUB_USERNAME}/${{ env.DOCKERHUB_USERNAME }}/g" ../docker-compose.prod.yml
        sed -i "s/\${IMAGE_TAG}/${{ needs.safety-check.outputs.main_branch_sha }}/g" ../docker-compose.prod.yml
        
        echo "✅ Generated docker-compose.prod.yml"
        echo "--- Preview ---"
        head -20 ../docker-compose.prod.yml

  # JOB 3: Deploy to EC2
  deploy:
    runs-on: ubuntu-latest
    needs: [safety-check, build-images]
    if: needs.safety-check.outputs.safe_to_proceed == 'true'
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Find EC2 Instances
      id: find-instances
      run: |
        echo "🔍 Finding EC2 instances..."
        
        # Try to find instances with uraws in name
        INSTANCE_IDS=$(aws ec2 describe-instances \
          --query "Reservations[].Instances[?Tags[?Key=='Name' && contains(Value, 'uraws')] && State.Name=='running'].InstanceId" \
          --output text)
        
        if [ -z "$INSTANCE_IDS" ]; then
          echo "Trying any running instance..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text | head -5)
        fi
        
        if [ -z "$INSTANCE_IDS" ]; then
          echo "::error::No running EC2 instances found"
          echo "Please ensure you have at least one running EC2 instance"
          exit 1
        fi
        
        echo "Found instances: $INSTANCE_IDS"
        echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
        
        COUNT=$(echo $INSTANCE_IDS | wc -w)
        echo "count=$COUNT" >> $GITHUB_OUTPUT
        
        echo "✅ Found $COUNT instance(s)"

  # JOB 4: Execute Deployment
  execute-deployment:
    runs-on: ubuntu-latest
    needs: [deploy, build-images]
    
    steps:
    - name: Get Instance ID
      id: get-instance
      run: |
        # Convert instance IDs to array and take first one
        INSTANCE_IDS=(${{ needs.deploy.outputs.instance_ids }})
        INSTANCE_ID=${INSTANCE_IDS[0]}
        
        echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
        echo "📦 Deploying to instance: $INSTANCE_ID"
    
    - name: Deploy to EC2 via SSM
      env:
        INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
        MAIN_SHA: ${{ needs.safety-check.outputs.main_branch_sha }}
        DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
      run: |
        echo "📝 Deploying to EC2..."
        
        aws ssm send-command \
          --instance-ids $INSTANCE_ID \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy $MAIN_SHA" \
          --parameters 'commands=[
            "set -e",
            "echo Deploying to /opt/uraws",
            "sudo mkdir -p /opt/uraws",
            "cd /opt/uraws",
            "sudo tee docker-compose.yml > /dev/null <<DCEOF",
            "version: \"3.8\"",
            "services:",
            "  mysql:",
            "    image: mysql:8.0",
            "    container_name: youraws-mysql",
            "    restart: unless-stopped",
            "    environment:",
            "      MYSQL_ROOT_PASSWORD: rootpassword",
            "      MYSQL_DATABASE: userdb",
            "    volumes:",
            "      - mysql_data:/var/lib/mysql",
            "    networks:",
            "      - app-network",
            "  backend:",
            "    image: '"$DOCKERHUB_USERNAME"'/youraws-backend:'"$MAIN_SHA"'",
            "    container_name: youraws-backend",
            "    restart: unless-stopped",
            "    depends_on:",
            "      - mysql",
            "    environment:",
            "      DATABASE_URL: mysql://root:rootpassword@mysql:3306/userdb",
            "      PORT: 5000",
            "      NODE_ENV: production",
            "    networks:",
            "      - app-network",
            "  frontend:",
            "    image: '"$DOCKERHUB_USERNAME"'/youraws-frontend:'"$MAIN_SHA"'",
            "    container_name: youraws-frontend",
            "    restart: unless-stopped",
            "    networks:",
            "      - app-network",
            "  nginx:",
            "    image: nginx:alpine",
            "    container_name: youraws-nginx",
            "    restart: unless-stopped",
            "    ports:",
            "      - \"80:80\"",
            "    networks:",
            "      - app-network",
            "networks:",
            "  app-network:",
            "    driver: bridge",
            "volumes:",
            "  mysql_data:",
            "    driver: local",
            "DCEOF",
            "sudo docker-compose down || true",
            "sudo docker-compose pull",
            "sudo docker-compose up -d",
            "sleep 10",
            "sudo docker-compose ps",
            "echo Deployment complete"
          ]' \
          --output text
        
        echo "✅ Deployment command sent"

  # JOB 5: Verification
  verify:
    runs-on: ubuntu-latest
    needs: execute-deployment
    if: always()
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Get Instance Public IP
      id: get-ip
      run: |
        INSTANCE_IDS=(${{ needs.deploy.outputs.instance_ids }})
        INSTANCE_ID=${INSTANCE_IDS[0]}
        
        PUBLIC_IP=$(aws ec2 describe-instances \
          --instance-ids $INSTANCE_ID \
          --query "Reservations[0].Instances[0].PublicIpAddress" \
          --output text)
        
        if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
          echo "instance_ip=not_available" >> $GITHUB_OUTPUT
          echo "⚠️ Instance has no public IP"
        else
          echo "instance_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "✅ Instance public IP: $PUBLIC_IP"
        fi
    
    - name: Verify Application
      if: steps.get-ip.outputs.instance_ip != 'not_available'
      env:
        INSTANCE_IP: ${{ steps.get-ip.outputs.instance_ip }}
      run: |
        echo "🔍 Verifying application on $INSTANCE_IP..."
        
        # Try health check first
        for i in {1..10}; do
          echo "Attempt $i/10..."
          
          if curl -s -f "http://$INSTANCE_IP/health" > /dev/null; then
            echo "✅ Health check passed"
            break
          else
            echo "Health check failed, waiting 10 seconds..."
            sleep 10
          fi
          
          if [ $i -eq 10 ]; then
            echo "❌ Health check failed after 10 attempts"
            exit 1
          fi
        done
        
        # Try main page
        echo "Testing main page..."
        if curl -s "http://$INSTANCE_IP" | head -c 100 | grep -q -i "html\|react"; then
          echo "✅ Frontend is serving HTML content"
        else
          echo "⚠️ Frontend response doesn't look like HTML"
        fi
    
    - name: Success Summary
      if: success()
      run: |
        echo ""
        echo "🎉🎉🎉 DEPLOYMENT SUCCESSFUL! 🎉🎉🎉"
        echo "=========================================="
        echo "Deployment ID: ${{ env.DEPLOYMENT_ID }}"
        echo "Main Branch SHA: ${{ needs.safety-check.outputs.main_branch_sha }}"
        echo "Docker Images:"
        echo "  Backend: ${{ env.DOCKERHUB_USERNAME }}/youraws-backend:${{ needs.safety-check.outputs.main_branch_sha }}"
        echo "  Frontend: ${{ env.DOCKERHUB_USERNAME }}/youraws-frontend:${{ needs.safety-check.outputs.main_branch_sha }}"
        echo "Deployed to: ${{ needs.deploy.outputs.count }} instance(s)"
        
        if [ "${{ steps.get-ip.outputs.instance_ip }}" != "not_available" ]; then
          echo "Access your application at:"
          echo "  http://${{ steps.get-ip.outputs.instance_ip }}"
          echo "  http://${{ steps.get-ip.outputs.instance_ip }}/health"
        fi
        
        echo "=========================================="
    
    - name: Failure Summary
      if: failure()
      run: |
        echo ""
        echo "❌❌❌ DEPLOYMENT FAILED ❌❌❌"
        echo "=========================================="
        echo "Please check:"
        echo "1. GitHub Actions logs above"
        echo "2. EC2 instance logs:"
        echo "   ssh -i your-key.pem ubuntu@YOUR_EC2_IP"
        echo "   cd /opt/uraws"
        echo "   docker-compose logs"
        echo "3. Ensure EC2 instance has:"
        echo "   - Docker and Docker Compose installed"
        echo "   - Port 80 open in security group"
        echo "=========================================="