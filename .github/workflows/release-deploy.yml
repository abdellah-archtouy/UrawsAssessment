name: Production Deployment Pipeline
on:
  push:
    branches:
      - release
    paths:
      - 'deploy-trigger.txt'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'nginx/**'

env:
  DOCKERHUB_NAMESPACE: aarchtou  # Your Docker Hub username
  DEPLOYMENT_ID: deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}
  AWS_REGION: us-east-1

jobs:
  # JOB 1: Validation & Safety Checks
  validate:
    runs-on: ubuntu-latest
    outputs:
      safe_to_proceed: ${{ steps.safety.outputs.safe }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: release
    
    - name: Validate Docker Compose
      run: |
        echo "🔍 Validating infrastructure..."
        
        # Test that docker-compose is valid
        docker-compose config --quiet || {
          echo "❌ Invalid docker-compose.yml"
          exit 1
        }
        
        # Check required directories
        if [ ! -d "backend" ]; then
          echo "⚠️ Warning: No backend directory"
        fi
        
        if [ ! -d "frontend" ]; then
          echo "⚠️ Warning: No frontend directory"
        fi
        
        echo "✅ Validation passed"
    
    - name: Check Safety Lock
      id: safety
      env:
        SAFETY_LOCK: ${{ secrets.SAFETY_LOCK_ENABLED || 'true' }}
      run: |
        if [ "$SAFETY_LOCK" = "true" ]; then
          echo "🔒 SAFETY LOCK ENABLED - Deployment blocked"
          echo "::notice::To deploy, set SAFETY_LOCK_ENABLED=false in GitHub Secrets"
          echo "safe=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Safety lock disabled - Ready for deployment"
          echo "safe=true" >> $GITHUB_OUTPUT
        fi

  # JOB 2: Build & Push Public Images
  build-and-push:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.safe_to_proceed == 'true'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Login to Docker Hub (for pushing)
      if: secrets.DOCKERHUB_TOKEN
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME || 'aarchtou' }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    # Build Backend
    - name: Build Backend Image
      id: build-backend
      run: |
        echo "🔨 Building Backend image..."
        
        if [ -f "backend/Dockerfile" ]; then
          cd backend
          docker build -t ${{ env.DOCKERHUB_NAMESPACE }}/youraws-backend:${{ env.DEPLOYMENT_ID }} .
          docker tag ${{ env.DOCKERHUB_NAMESPACE }}/youraws-backend:${{ env.DEPLOYMENT_ID }} ${{ env.DOCKERHUB_NAMESPACE }}/youraws-backend:latest
          echo "backend_image=${{ env.DOCKERHUB_NAMESPACE }}/youraws-backend:${{ env.DEPLOYMENT_ID }}" >> $GITHUB_OUTPUT
          echo "✅ Backend image built"
        else
          echo "⚠️ No backend/Dockerfile found"
          echo "backend_image=skip" >> $GITHUB_OUTPUT
        fi
    
    - name: Push Backend to Docker Hub
      if: steps.build-backend.outputs.backend_image != 'skip' && secrets.DOCKERHUB_TOKEN
      run: |
        echo "📤 Pushing Backend to Docker Hub..."
        docker push ${{ env.DOCKERHUB_NAMESPACE }}/youraws-backend:${{ env.DEPLOYMENT_ID }}
        docker push ${{ env.DOCKERHUB_NAMESPACE }}/youraws-backend:latest
        echo "✅ Backend pushed to Docker Hub (public)"
    
    # Build Frontend
    - name: Build Frontend Image
      id: build-frontend
      run: |
        echo "🔨 Building Frontend image..."
        
        if [ -f "frontend/Dockerfile" ]; then
          cd frontend
          docker build -t ${{ env.DOCKERHUB_NAMESPACE }}/youraws-frontend:${{ env.DEPLOYMENT_ID }} .
          docker tag ${{ env.DOCKERHUB_NAMESPACE }}/youraws-frontend:${{ env.DEPLOYMENT_ID }} ${{ env.DOCKERHUB_NAMESPACE }}/youraws-frontend:latest
          echo "frontend_image=${{ env.DOCKERHUB_NAMESPACE }}/youraws-frontend:${{ env.DEPLOYMENT_ID }}" >> $GITHUB_OUTPUT
          echo "✅ Frontend image built"
        else
          echo "⚠️ No frontend/Dockerfile found"
          echo "frontend_image=skip" >> $GITHUB_OUTPUT
        fi
    
    - name: Push Frontend to Docker Hub
      if: steps.build-frontend.outputs.frontend_image != 'skip' && secrets.DOCKERHUB_TOKEN
      run: |
        echo "📤 Pushing Frontend to Docker Hub..."
        docker push ${{ env.DOCKERHUB_NAMESPACE }}/youraws-frontend:${{ env.DEPLOYMENT_ID }}
        docker push ${{ env.DOCKERHUB_NAMESPACE }}/youraws-frontend:latest
        echo "✅ Frontend pushed to Docker Hub (public)"
    
    - name: Generate Deployment Script
      id: generate-script
      run: |
        echo "📝 Generating deployment script..."
        
        # Create a simple deployment script for EC2
        cat > deploy.sh << 'EOF'
#!/bin/bash
set -e

echo "🚀 Starting deployment on $(date)"
echo "Deployment ID: $1"

# Configuration
DOCKERHUB_NAMESPACE="aarchtou"
DEPLOYMENT_ID="$1"
APP_DIR="/opt/uraws"

# Navigate to app directory
cd $APP_DIR || { echo "❌ Directory $APP_DIR not found"; exit 1; }

# Create backup of current compose file
if [ -f "docker-compose.yml" ]; then
  cp docker-compose.yml "docker-compose.backup.$(date +%Y%m%d-%H%M%S).yml"
fi

# Create new docker-compose.yml with deployment tag
cat > docker-compose.yml << DOCKEREOF
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: youraws-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userdb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  backend:
    image: ${DOCKERHUB_NAMESPACE}/youraws-backend:${DEPLOYMENT_ID}
    container_name: youraws-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/userdb
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: "*"
    networks:
      - app-network

  frontend:
    image: ${DOCKERHUB_NAMESPACE}/youraws-frontend:${DEPLOYMENT_ID}
    container_name: youraws-frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: youraws-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
DOCKEREOF

echo "📄 Created docker-compose.yml with image tag: ${DEPLOYMENT_ID}"

# Pull new images
echo "⬇️ Pulling Docker images..."
docker-compose pull

# Stop and remove old containers
echo "🛑 Stopping old containers..."
docker-compose down

# Start new containers
echo "▶️ Starting new containers..."
docker-compose up -d

# Clean up old images
echo "🧹 Cleaning up old images..."
docker image prune -af --filter "until=24h"

echo "✅ Deployment completed successfully!"
echo "🔍 Checking container status..."
docker-compose ps

# Health check
echo "🏥 Running health checks..."
sleep 10
if curl -s http://localhost:80/health > /dev/null; then
  echo "✅ Health check passed"
else
  echo "⚠️ Health check endpoint not responding, but containers are running"
fi
EOF
        
        chmod +x deploy.sh
        echo "✅ Deployment script generated"

  # JOB 3: Deploy to EC2 (Simplified - No Docker Hub Login Needed)
  deploy:
    runs-on: ubuntu-latest
    needs: [validate, build-and-push]
    if: needs.validate.outputs.safe_to_proceed == 'true'
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Find EC2 Instances by Tags
      id: find-instances
      run: |
        echo "🔍 Finding EC2 instances..."
        
        # Find all running instances with the right tags
        INSTANCE_IDS=$(aws ec2 describe-instances \
          --filters \
            "Name=tag:Name,Values=uraws-*" \
            "Name=tag:Environment,Values=production" \
            "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].InstanceId" \
          --output text)
        
        if [ -z "$INSTANCE_IDS" ]; then
          echo "❌ No EC2 instances found with matching tags"
          echo "Trying alternative tag search..."
          
          # Try alternative tag patterns
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Application,Values=uraws" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
        fi
        
        if [ -z "$INSTANCE_IDS" ]; then
          echo "::error::No EC2 instances found. Please check your tags."
          echo "Current tags in your account:"
          aws ec2 describe-instances \
            --query "Reservations[].Instances[].[InstanceId,State.Name,Tags]" \
            --output table | head -20
          exit 1
        fi
        
        echo "Found instances: $INSTANCE_IDS"
        echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
        
        # Count for output
        COUNT=$(echo $INSTANCE_IDS | wc -w)
        echo "count=$COUNT" >> $GITHUB_OUTPUT
    
    - name: Deploy to EC2 Instances (Zero-Downtime)
      env:
        DEPLOYMENT_ID: ${{ env.DEPLOYMENT_ID }}
      run: |
        echo "🚀 Starting deployment to ${{ steps.find-instances.outputs.count }} instance(s)"
        
        INSTANCE_COUNTER=1
        for INSTANCE_ID in ${{ steps.find-instances.outputs.instance_ids }}; do
          echo ""
          echo "=========================================="
          echo "Instance $INSTANCE_COUNTER: $INSTANCE_ID"
          echo "=========================================="
          
          # Step 1: Create directory structure
          echo "📁 Setting up directory structure..."
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo mkdir -p /opt/uraws/nginx",
              "sudo chown -R ubuntu:ubuntu /opt/uraws || true",
              "cd /opt/uraws"
            ]' \
            --output text
          
          # Step 2: Upload nginx config (if exists)
          if [ -f "nginx/nginx.conf" ]; then
            echo "📄 Uploading nginx configuration..."
            NGINX_CONFIG=$(cat nginx/nginx.conf | sed 's/"/\\"/g')
            aws ssm send-command \
              --instance-ids $INSTANCE_ID \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[
                'cat > /opt/uraws/nginx/nginx.conf << \"NGINXEOF\"',
                '$NGINX_CONFIG',
                'NGINXEOF'
              ]" \
              --output text
          fi
          
          # Step 3: Upload and execute deployment script
          echo "⚡ Executing deployment..."
          
          # Read the deploy.sh script and escape it for SSM
          DEPLOY_SCRIPT=$(cat deploy.sh | sed 's/"/\\"/g')
          
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'cd /opt/uraws',
              'cat > deploy.sh << \"DEPLOYEOF\"',
              '$DEPLOY_SCRIPT',
              'DEPLOYEOF',
              'chmod +x deploy.sh',
              './deploy.sh \"$DEPLOYMENT_ID\"'
            ]" \
            --output text
          
          # Step 4: Wait for this instance to be healthy before next
          if [ $INSTANCE_COUNTER -lt ${{ steps.find-instances.outputs.count }} ]; then
            echo "⏳ Waiting for instance to stabilize before next deployment..."
            sleep 30
            
            # Quick health check
            echo "🏥 Checking instance health..."
            aws ssm send-command \
              --instance-ids $INSTANCE_ID \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "cd /opt/uraws",
                "docker-compose ps | grep -c \"Up\""
              ]' \
              --output text
          fi
          
          INSTANCE_COUNTER=$((INSTANCE_COUNTER + 1))
        done
        
        echo ""
        echo "✅ All instances deployment initiated"

  # JOB 4: Final Verification
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Verify Load Balancer
      env:
        ALB_DNS: ${{ secrets.ALB_DNS_NAME }}
      run: |
        echo "🔍 Verifying deployment via Load Balancer..."
        
        if [ -z "$ALB_DNS" ]; then
          echo "⚠️ ALB_DNS_NAME not configured, skipping LB check"
          exit 0
        fi
        
        echo "Testing Load Balancer: $ALB_DNS"
        
        for i in {1..10}; do
          echo "Attempt $i/10..."
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/" || echo "000")
          
          case $HTTP_CODE in
            200|301|302)
              echo "✅ Load Balancer responding with HTTP $HTTP_CODE"
              
              # Try to get actual content
              if curl -s "http://$ALB_DNS/health" | grep -q "healthy"; then
                echo "✅ Application health endpoint is healthy"
              elif curl -s "http://$ALB_DNS/" | head -c 100 | grep -q "<html"; then
                echo "✅ HTML content served successfully"
              fi
              
              echo "🚀 DEPLOYMENT VERIFIED SUCCESSFULLY!"
              exit 0
              ;;
            *)
              echo "Got HTTP $HTTP_CODE, retrying in 10 seconds..."
              sleep 10
              ;;
          esac
        done
        
        echo "❌ Load Balancer verification failed after 10 attempts"
        echo "Last HTTP code: $HTTP_CODE"
        
        # Try to get more debug info
        echo "Debug info:"
        curl -v "http://$ALB_DNS/" 2>&1 | head -20 || true
        
        exit 1
    
    - name: Rollback if Verification Fails
      if: failure()
      run: |
        echo "🔄 Verification failed - Initiating rollback..."
        
        # Get all instances
        INSTANCE_IDS=${{ steps.find-instances.outputs.instance_ids }}
        
        for INSTANCE_ID in $INSTANCE_IDS; do
          echo "Rolling back instance: $INSTANCE_ID"
          
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/uraws",
              "echo \"Looking for backup files...\"",
              "BACKUP_FILE=$(ls -t docker-compose.backup.*.yml 2>/dev/null | head -1)",
              "if [ -n \"$BACKUP_FILE\" ]; then",
              "  echo \"Found backup: $BACKUP_FILE\"",
              "  cp \"$BACKUP_FILE\" docker-compose.yml",
              "  docker-compose down",
              "  docker-compose up -d",
              "  echo \"Rollback completed\"",
              "else",
              "  echo \"No backup found. Checking current status...\"",
              "  docker-compose ps",
              "fi"
            ]' \
            --output text
        done
        
        echo "✅ Rollback initiated on all instances"
    
    - name: Success Summary
      if: success()
      run: |
        echo ""
        echo "🎉🎉🎉 DEPLOYMENT COMPLETE 🎉🎉🎉"
        echo "======================================"
        echo "Deployment ID: ${{ env.DEPLOYMENT_ID }}"
        echo "Timestamp: $(date)"
        echo "Images built:"
        echo "  Backend: aarchtou/youraws-backend:${{ env.DEPLOYMENT_ID }}"
        echo "  Frontend: aarchtou/youraws-frontend:${{ env.DEPLOYMENT_ID }}"
        echo "Deployed to: ${{ steps.find-instances.outputs.count }} instance(s)"
        echo "Load Balancer: ${{ secrets.ALB_DNS_NAME || 'Not configured' }}"
        echo "======================================"
        echo ""