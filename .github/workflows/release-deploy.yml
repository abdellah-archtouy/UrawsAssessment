name: Blue-Green Deployment Pipeline
on:
  push:
    branches: [release]
    paths: [deploy-trigger.txt]

env:
  DOCKERHUB_USERNAME: 'aarchtou'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get Main Branch Commit SHA
      id: get-sha
      run: |
        SHA=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1 | head -c 8)
        echo "sha=$SHA" >> $GITHUB_OUTPUT
        echo "✅ Main branch SHA: $SHA"
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Deploy New Release
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        MAIN_SHA: ${{ steps.get-sha.outputs.sha }}
      run: |
        echo "🚀 Starting blue-green deployment..."
        echo "Instance: $INSTANCE_ID"
        echo "Image tag: $MAIN_SHA"
        
        # Create deployment timestamp
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        RELEASE_DIR="myapp-release-$TIMESTAMP"
        
        # Create the deployment commands
        DEPLOY_COMMANDS=$(cat << 'COMMANDS'
        #!/bin/bash
        set -e

        echo "🎯 DEPLOYMENT STARTED"
        echo "====================="
        echo "Timestamp: $TIMESTAMP"
        echo "Release dir: $RELEASE_DIR"
        echo "Image tag: $MAIN_SHA"
        echo ""

        cd /home/ubuntu

        echo "1. Creating new release directory: releases/$RELEASE_DIR"
        mkdir -p releases/$RELEASE_DIR
        mkdir -p releases/$RELEASE_DIR/nginx

        echo "2. Downloading docker-compose.yml from main branch..."
        curl -s https://raw.githubusercontent.com/abdellah-archtou/UrawsAssessment/main/docker-compose.yml -o releases/$RELEASE_DIR/docker-compose.yml

        echo "3. Downloading nginx config from main branch..."
        curl -s https://raw.githubusercontent.com/abdellah-archtou/UrawsAssessment/main/nginx/nginx.conf -o releases/$RELEASE_DIR/nginx/nginx.conf 2>/dev/null || echo "⚠️ No nginx config found"

        echo "4. Updating image tags in docker-compose.yml..."
        cd releases/$RELEASE_DIR
        sed -i "s|aarchtou/youraws-backend:latest|aarchtou/youraws-backend:$MAIN_SHA|g" docker-compose.yml
        sed -i "s|aarchtou/youraws-frontend:latest|aarchtou/youraws-frontend:$MAIN_SHA|g" docker-compose.yml

        echo "5. Pulling Docker images..."
        docker-compose pull || {
        echo "⚠️ Pull failed, trying to continue..."
        }

        echo "6. Testing new release..."
        docker-compose up -d --no-start
        if docker-compose ps | grep -q "Exit"; then
        echo "❌ New release failed validation"
        docker-compose down
        exit 1
        fi
        docker-compose down

        echo "7. Running your existing deploy.sh script..."
        cd /home/ubuntu
        if [ -f "deploy/deploy.sh" ]; then
        chmod +x deploy/deploy.sh
        ./deploy/deploy.sh /home/ubuntu/releases/$RELEASE_DIR
        echo "✅ Deployed using existing deploy.sh"
        else
        echo "⚠️ No deploy.sh found, using direct method..."
        cd releases/$RELEASE_DIR
        docker-compose up -d
        fi

        echo "8. Checking deployment status..."
        sleep 10
        docker-compose ps

        echo "9. Testing application health..."
        curl -s http://localhost/health && echo "✅ Health check passed" || echo "⚠️ Health check failed"

        echo ""
        echo "🎉 DEPLOYMENT COMPLETE"
        echo "====================="
        echo "New release: $RELEASE_DIR"
        echo "Image tag: $MAIN_SHA"
        echo "Active release: $(readlink -f /home/ubuntu/myapp 2>/dev/null || echo 'Unknown')"
        COMMANDS
                )

        # Send deployment command
        echo "📤 Sending deployment commands to EC2..."
        aws ssm send-command \
          --instance-ids $INSTANCE_ID \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            'cd /tmp',
            'TIMESTAMP=\"'$TIMESTAMP'\"',
            'RELEASE_DIR=\"'$RELEASE_DIR'\"',
            'MAIN_SHA=\"'$MAIN_SHA'\"',
            'cat > deploy.sh << \"EOF\"',
            '$DEPLOY_COMMANDS',
            'EOF',
            'chmod +x deploy.sh',
            './deploy.sh'
          ]" \
          --output text
        
        echo "✅ Deployment command sent"
    
    - name: Wait and Verify
      run: |
        echo "⏳ Waiting 45 seconds for deployment to complete..."
        sleep 45
        echo "✅ Deployment should be processing"
    
    - name: Verify Instructions
      run: |
        echo ""
        echo "🔍 VERIFICATION INSTRUCTIONS"
        echo "============================="
        echo ""
        echo "1. SSH into your EC2 instance:"
        echo "   ssh -i your-key.pem ubuntu@YOUR_EC2_IP"
        echo ""
        echo "2. Check the new release:"
        echo "   ls -la /home/ubuntu/releases/"
        echo ""
        echo "3. Check current active release:"
        echo "   ls -la /home/ubuntu/myapp"
        echo "   readlink -f /home/ubuntu/myapp"
        echo ""
        echo "4. Check Docker containers:"
        echo "   cd /home/ubuntu/myapp"
        echo "   docker-compose ps"
        echo "   docker-compose logs"
        echo ""
        echo "5. Test the application:"
        echo "   curl http://localhost/health"
        echo "   curl http://localhost"