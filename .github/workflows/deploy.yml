name: Minimal SSM Deploy

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Run SSM Command
      run: |
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters '{
            "commands": [
              "#!/bin/bash",
              "set -e",

              "echo \"🚀 Starting deployment\"",
              "cd /home/ubuntu",

              "# ---- CODE DEPLOY ----",
              "if [ -d \"app/.git\" ]; then",
              "  cd app",
              "  git fetch origin",
              "  git checkout release",
              "  git pull origin release",
              "else",
              "  git clone https://github.com/${{ github.repository }}.git app",
              "  cd app",
              "fi",

              "docker compose down 2>/dev/null || true",
              "docker compose up -d --build",

              "echo \"⏳ Waiting for services to be ready\"",
              "sleep 15",

              "# ---- CERTBOT INSTALL ----",
              "if ! command -v certbot >/dev/null 2>&1; then",
              "  echo \"🔐 Installing Certbot\"",
              "  apt-get update",
              "  apt-get install -y certbot python3-certbot-nginx",
              "fi",

              "# ---- SSL CERTIFICATE ----",
              "echo \"🔒 Requesting / renewing SSL certificate\"",
              "certbot --nginx \
                -d aarchtou.me \
                -d www.aarchtou.me \
                --non-interactive \
                --agree-tos \
                -m admin@aarchtou.me \
                || echo \"⚠️ Certbot already configured\"",

              "# ---- RELOAD NGINX ----",
              "nginx -t",
              "systemctl reload nginx",

              "echo \"✅ Deployment + HTTPS complete\"",
              "docker compose ps"
            ]
          }' \
          --comment "GitHub Actions deployment + SSL by ${{ github.actor }}"
