name: Production Deploy

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",

              "echo \"🚀 START DEPLOY\"",

              "# 1️⃣ Ensure base directories",
              "mkdir -p /home/ubuntu",
              "cd /home/ubuntu",

              "# 2️⃣ Clone repo if missing",
              "if [ ! -d repo ]; then git clone https://github.com/abdellah-archtouy/UrawsAssessment.git repo; fi",

              "cd repo",

              "# 3️⃣ Fetch ALL branches",
              "git fetch origin",

              "# 4️⃣ Copy deploy folder from release",
              "git checkout origin/release -- deploy",

              "# 5️⃣ Move deploy to stable location",
              "rm -rf /home/ubuntu/deploy",
              "mv deploy /home/ubuntu/deploy",
              "chmod +x /home/ubuntu/deploy/deploy.sh",

              "# 6️⃣ Update app code from main",
              "git checkout main",
              "git pull origin main",

              "# 7️⃣ Run deploy script",
              "/home/ubuntu/deploy/deploy.sh",

              "echo \"✅ DEPLOY DONE\""
            ]'
