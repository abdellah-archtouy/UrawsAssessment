name: Auto Deploy (main code + release deploy)

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu",
              "if [ ! -d app ]; then git clone https://github.com/abdellah-archtouy/UrawsAssessment.git app; fi",
              "cd app",
              "git fetch origin",
              
              "# Checkout main for app code",
              "git checkout main",
              "git pull origin main",
              
              "# Extract deploy script from release",
              "git checkout release -- deploy",
              "chmod +x deploy/deploy.sh",
              
              "./deploy/deploy.sh"
            ]' \
            --comment "Deploy main with release deploy script"
