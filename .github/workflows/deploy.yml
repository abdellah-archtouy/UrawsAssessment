name: Deploy with HTTPS

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
    
    - name: Run SSM Deployment
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DOMAIN: ${{ secrets.DOMAIN || 'aarchtou.me' }}
        EMAIL: ${{ secrets.EMAIL || 'admin@aarchtou.me' }}
      run: |
        # Create a script file to avoid JSON escaping issues
        cat > /tmp/deploy_script.sh << 'SCRIPT_EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Starting deployment"
        cd /home/ubuntu
        
        # ---- CODE DEPLOY ----
        if [ -d "app/.git" ]; then
          cd app
          git fetch origin
          git checkout release
          git pull origin release
        else
          git clone https://github.com/abdellah-archtouy/UrawsAssessment.git app
          cd app
        fi
        
        echo "🐳 Starting Docker containers..."
        docker compose down 2>/dev/null || true
        docker compose up -d --build
        
        echo "⏳ Waiting for services to be ready"
        sleep 15
        
        # ---- CERTBOT INSTALL ----
        if ! command -v certbot >/dev/null 2>&1; then
          echo "🔐 Installing Certbot"
          apt-get update
          apt-get install -y certbot python3-certbot-nginx
        fi
        
        # ---- SSL CERTIFICATE ----
        echo "🔒 Requesting/renewing SSL certificate"
        
        # Check if certbot is already configured
        if [ -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
          echo "📜 Certificate exists, renewing..."
          certbot renew --quiet --no-self-upgrade
        else
          echo "📜 Requesting new certificate..."
          certbot --nginx \
            -d "$DOMAIN" \
            -d "www.$DOMAIN" \
            --non-interactive \
            --agree-tos \
            --email "$EMAIL" \
            --redirect \
            --hsts \
            --staple-ocsp
        fi
        
        # ---- RELOAD NGINX ----
        echo "🔄 Reloading Nginx"
        nginx -t && systemctl reload nginx
        
        echo "✅ Deployment + HTTPS complete"
        echo "📊 Running containers:"
        docker compose ps
        
        echo "🔍 Checking HTTPS endpoint..."
        curl -I https://$DOMAIN || echo "⚠️ HTTPS check failed, but deployment completed"
        SCRIPT_EOF
        
        # Make script executable
        chmod +x /tmp/deploy_script.sh
        
        # Extract commands and properly escape them
        # Read the script line by line and create a JSON array
        readarray -t COMMANDS < /tmp/deploy_script.sh
        
        # Create JSON array of commands
        JSON_COMMANDS="["
        for i in "${!COMMANDS[@]}"; do
          # Escape special characters for JSON
          ESCAPED_CMD=$(echo "${COMMANDS[$i]}" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
          JSON_COMMANDS+="\"$ESCAPED_CMD\""
          if [ $i -lt $((${#COMMANDS[@]} - 1)) ]; then
            JSON_COMMANDS+=","
          fi
        done
        JSON_COMMANDS+="]"
        
        # Create parameters JSON
        PARAMETERS_JSON="{\"commands\": $JSON_COMMANDS}"
        
        echo "📤 Sending deployment command to EC2 instance: $INSTANCE_ID"
        
        # Save parameters to a file
        echo "$PARAMETERS_JSON" > /tmp/ssm_params.json
        
        # Send SSM command
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters file:///tmp/ssm_params.json \
          --comment "GitHub Actions deployment triggered by ${{ github.actor }}" \
          --output text
        
        echo "✅ SSM command sent successfully"
        
        # Cleanup
        rm -f /tmp/deploy_script.sh /tmp/ssm_params.json