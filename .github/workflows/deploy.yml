name: Deploy to EC2

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set environment based on branch
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "RELEASE_ID=release-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
            echo "RELEASE_ID=main-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        id: deploy-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ steps.set-env.outputs.ENVIRONMENT }} - ${{ steps.set-env.outputs.RELEASE_ID }}" \
            --parameters 'commands=[
              "set -e",
              "echo \"═══════════════════════════════════════\"",
              "echo \"🚀 Starting Deployment\"",
              "echo \"Version: ${{ steps.set-env.outputs.RELEASE_ID }}\"",
              "echo \"Branch: ${{ github.ref_name }}\"",
              "echo \"Commit: ${{ github.sha }}\"",
              "echo \"═══════════════════════════════════════\"",
              "",
              "DEPLOY_DIR=\"/home/ubuntu/myapp\"",
              "RELEASES_DIR=\"/home/ubuntu/releases\"",
              "",
              "echo \"[1/6] 💾 Backing up current version...\"",
              "if [ -d \"$DEPLOY_DIR\" ]; then",
              "  cp -r \"$DEPLOY_DIR\" \"$RELEASES_DIR/myapp-${{ steps.set-env.outputs.RELEASE_ID }}\"",
              "  echo \"✅ Backup created: $RELEASES_DIR/myapp-${{ steps.set-env.outputs.RELEASE_ID }}\"",
              "else",
              "  echo \"⚠️  No existing deployment to backup\"",
              "fi",
              "",
              "echo \"[2/6] 📥 Pulling latest code from GitHub...\"",
              "if [ -d \"$DEPLOY_DIR/.git\" ]; then",
              "  cd \"$DEPLOY_DIR\"",
              "  git fetch --all",
              "  git reset --hard origin/${{ github.ref_name }}",
              "  git clean -fd",
              "  echo \"✅ Code updated from origin/${{ github.ref_name }}\"",
              "else",
              "  git clone -b ${{ github.ref_name }} https://github.com/abdellah-archtouy/UrawsAssessment.git \"$DEPLOY_DIR\"",
              "  echo \"✅ Repository cloned\"",
              "fi",
              "",
              "cd \"$DEPLOY_DIR\"",
              "",
              "echo \"[3/6] 🐳 Pulling latest Docker images...\"",
              "docker compose pull",
              "echo \"✅ Docker images updated\"",
              "",
              "echo \"[4/6] 🛑 Stopping old containers...\"",
              "docker compose down || true",
              "echo \"✅ Old containers stopped\"",
              "",
              "echo \"[5/6] 🚀 Starting new containers...\"",
              "docker compose up -d --build",
              "echo \"✅ New containers started\"",
              "",
              "echo \"[6/6] 🧹 Cleaning up old Docker resources...\"",
              "docker system prune -f --volumes || true",
              "",
              "echo \"═══════════════════════════════════════\"",
              "echo \"✅ DEPLOYMENT COMPLETED SUCCESSFULLY\"",
              "echo \"═══════════════════════════════════════\"",
              "echo \"Running containers:\"",
              "docker compose ps"
            ]' \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for deployment to complete
        run: |
          echo "⏳ Waiting for deployment to complete..."
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy-command.outputs.COMMAND_ID }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text)
            
            echo "Status: $STATUS (attempt $i/120)"
            
            if [[ "$STATUS" == "Success" ]]; then
              echo ""
              echo "✅ Deployment successful!"
              echo ""
              echo "Deployment output:"
              aws ssm get-command-invocation \
                --command-id "${{ steps.deploy-command.outputs.COMMAND_ID }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            elif [[ "$STATUS" == "Failed" ]] || [[ "$STATUS" == "Cancelled" ]] || [[ "$STATUS" == "TimedOut" ]]; then
              echo ""
              echo "❌ Deployment failed with status: $STATUS"
              echo ""
              echo "Error output:"
              aws ssm get-command-invocation \
                --command-id "${{ steps.deploy-command.outputs.COMMAND_ID }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query 'StandardErrorContent' \
                --output text
              echo ""
              echo "Standard output:"
              aws ssm get-command-invocation \
                --command-id "${{ steps.deploy-command.outputs.COMMAND_ID }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query 'StandardOutputContent' \
                --output text
              exit 1
            fi
            
            sleep 5
          done
          
          echo "❌ Deployment timed out after 10 minutes"
          exit 1

      - name: Deployment Summary
        if: success()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "════════════════════════════════════════"
          echo "Environment:    ${{ steps.set-env.outputs.ENVIRONMENT }}"
          echo "Release ID:     ${{ steps.set-env.outputs.RELEASE_ID }}"
          echo "Branch:         ${{ github.ref_name }}"
          echo "Commit:         ${{ github.sha }}"
          echo "Deployed by:    ${{ github.actor }}"
          echo "════════════════════════════════════════"
          echo ""
          echo "📝 Rollback available at:"
          echo "   /home/ubuntu/releases/myapp-${{ steps.set-env.outputs.RELEASE_ID }}"