name: Deploy Application

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
    
    - name: Upload and Run Deployment Scripts
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DOMAIN: ${{ secrets.DOMAIN }}
        EMAIL: ${{ secrets.EMAIL }}
      run: |
        # Create a simple deployment command
        DEPLOY_COMMAND=$(cat << 'EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Starting automated deployment"
        echo "================================"
        
        # Variables
        DOMAIN="$1"
        EMAIL="$2"
        
        # Go to home directory
        cd /home/ubuntu
        
        # Step 1: Update or clone repository
        echo "📦 Step 1: Getting latest code..."
        if [ -d "app/.git" ]; then
          cd app
          git fetch origin
          git checkout release
          git pull origin release
        else
          git clone -b release https://github.com/abdellah-archtouy/UrawsAssessment.git app
          cd app
        fi
        
        # Step 2: Run pre-deployment checks
        echo "🔍 Step 2: Running pre-deployment checks..."
        
        # Make sure we have the deploy directory
        if [ -d "deploy" ]; then
          echo "✅ Found deploy scripts"
          chmod +x deploy/*.sh 2>/dev/null || true
        else
          echo "❌ No deploy directory found"
          exit 1
        fi
        
        # Step 3: Run pre-deploy script (if exists)
        if [ -f "deploy/pre_deploy.sh" ]; then
          echo "🔧 Step 3: Running pre-deployment setup..."
          chmod +x deploy/pre_deploy.sh
          DOMAIN="$DOMAIN" EMAIL="$EMAIL" ./deploy/pre_deploy.sh
        fi
        
        # Step 4: Run main deployment
        echo "🐳 Step 4: Deploying application..."
        if [ -f "deploy/deploy.sh" ]; then
          chmod +x deploy/deploy.sh
          DOMAIN="$DOMAIN" EMAIL="$EMAIL" ./deploy/deploy.sh
        else
          # Fallback to docker compose
          docker compose down 2>/dev/null || true
          docker compose up -d --build
        fi
        
        # Wait for services
        echo "⏳ Waiting for services to start..."
        sleep 30
        
        # Step 5: Run post-deploy script (if exists)
        if [ -f "deploy/post_deploy.sh" ]; then
          echo "✅ Step 5: Running post-deployment verification..."
          chmod +x deploy/post_deploy.sh
          DOMAIN="$DOMAIN" EMAIL="$EMAIL" ./deploy/post_deploy.sh
        else
          # Basic verification
          echo "📊 Container status:"
          docker compose ps
          
          echo "🔍 Testing HTTP:"
          curl -s -o /dev/null -w "HTTP: %{http_code}\n" http://localhost || echo "HTTP test failed"
          
          echo "🔒 Testing HTTPS:"
          curl -s -o /dev/null -w "HTTPS: %{http_code}\n" https://localhost 2>/dev/null || echo "HTTPS not configured"
        fi
        
        echo ""
        echo "🎉 Deployment completed successfully!"
        echo "🌐 Application should be accessible at: https://$DOMAIN"
        EOF
        )
        
        # Create the SSM command that runs our script
        cat > /tmp/ssm_command.json << 'EOF'
        {
          "commands": [
            "#!/bin/bash",
            "set -e",
            "",
            "# Create deployment script",
            "cat > /tmp/deploy_main.sh << 'SCRIPT_END'",
            "#!/bin/bash",
            "set -e",
            "DOMAIN=\"$DOMAIN\"",
            "EMAIL=\"$EMAIL\"",
            "cd /home/ubuntu",
            "",
            "# Update or clone repository",
            "if [ -d \"app/.git\" ]; then",
            "  cd app",
            "  git fetch origin",
            "  git checkout release",
            "  git pull origin release",
            "else",
            "  git clone -b release https://github.com/abdellah-archtouy/UrawsAssessment.git app",
            "  cd app",
            "fi",
            "",
            "# Run deployment scripts",
            "if [ -d \"deploy\" ]; then",
            "  chmod +x deploy/*.sh 2>/dev/null || true",
            "  [ -f \"deploy/pre_deploy.sh\" ] && DOMAIN=\"$DOMAIN\" EMAIL=\"$EMAIL\" ./deploy/pre_deploy.sh",
            "  [ -f \"deploy/deploy.sh\" ] && DOMAIN=\"$DOMAIN\" EMAIL=\"$EMAIL\" ./deploy/deploy.sh || docker compose up -d --build",
            "  sleep 30",
            "  [ -f \"deploy/post_deploy.sh\" ] && DOMAIN=\"$DOMAIN\" EMAIL=\"$EMAIL\" ./deploy/post_deploy.sh",
            "else",
            "  echo \"No deploy directory found\"",
            "  docker compose up -d --build",
            "fi",
            "",
            "# Final check",
            "echo \"Deployment completed!\"",
            "docker compose ps",
            "SCRIPT_END",
            "",
            "# Make it executable and run",
            "chmod +x /tmp/deploy_main.sh",
            "/tmp/deploy_main.sh"
          ]
        }
        EOF
        
        # Send the SSM command
        echo "📤 Sending deployment command to EC2 instance: $INSTANCE_ID"
        
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters file:///tmp/ssm_command.json \
          --comment "GitHub Actions Deployment" \
          --timeout-seconds 600
        
        echo "✅ Deployment command sent successfully"