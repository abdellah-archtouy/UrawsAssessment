name: Deploy Application with HTTPS

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout release branch
      uses: actions/checkout@v4
      with:
        ref: release
    
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
    
    - name: Deploy via SSM
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DOMAIN: ${{ secrets.DOMAIN || 'aarchtou.me' }}
        EMAIL: ${{ secrets.EMAIL || 'admin@aarchtou.me' }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'rootpassword' }}
      run: |
        # Create deployment script with base64 encoding to avoid JSON issues
        DEPLOY_SCRIPT=$(cat << 'SCRIPT_EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Starting deployment with HTTPS setup"
        echo "========================================"
        
        # Variables
        DOMAIN="${1:-aarchtou.me}"
        EMAIL="${2:-admin@aarchtou.me}"
        DB_PASSWORD="${3:-rootpassword}"
        
        echo "Domain: $DOMAIN"
        echo "Email: $EMAIL"
        echo "Timestamp: $(date)"
        
        # Go to home directory
        cd /home/ubuntu
        
        # Step 1: Get latest code
        echo ""
        echo "📦 STEP 1: GETTING LATEST CODE"
        echo "----------------------------------------"
        if [ -d "app/.git" ]; then
          echo "Updating existing repository..."
          cd app
          git fetch origin
          git checkout release
          git pull origin release
        else
          echo "Cloning repository for first time..."
          git clone -b release https://github.com/abdellah-archtouy/UrawsAssessment.git app
          cd app
        fi
        
        echo "✅ Code updated"
        
        # Step 2: Setup environment and directories
        echo ""
        echo "🔧 STEP 2: SETTING UP ENVIRONMENT"
        echo "----------------------------------------"
        
        # Create necessary directories
        mkdir -p ./certificates
        mkdir -p ./certbot/www
        mkdir -p ./nginx
        
        # Create .env file for backend
        cat > .env << ENV_EOF
        DATABASE_URL=mysql://root:${DB_PASSWORD}@mysql:3306/userdb
        PORT=5000
        NODE_ENV=production
        CORS_ORIGIN=*
        ENV_EOF
        
        echo "✅ Environment files created"
        
        # Step 3: Setup SSL certificates
        echo ""
        echo "🔐 STEP 3: SETTING UP SSL CERTIFICATES"
        echo "----------------------------------------"
        
        # Install certbot if not installed
        if ! command -v certbot >/dev/null 2>&1; then
          echo "Installing certbot..."
          sudo apt update
          sudo apt install -y certbot python3-certbot-nginx
        fi
        
        echo "Checking existing certificates..."
        
        # Check if we already have certificates
        if [ -d "/etc/letsencrypt/live/$DOMAIN" ]; then
          echo "✅ Certificates already exist, renewing..."
          sudo certbot renew --quiet
        else
          echo "🔐 Obtaining new SSL certificates..."
          
          # Stop any container using port 80 temporarily
          docker stop nginx 2>/dev/null || true
          
          # Get certificates using standalone mode
          sudo certbot certonly --standalone \
            -d "$DOMAIN" \
            -d "www.$DOMAIN" \
            --non-interactive \
            --agree-tos \
            --email "$EMAIL" \
            --http-01-port=8080 \
            --force-renewal || {
              echo "⚠️ Certbot failed, but continuing with existing certificates if any"
            }
        fi
        
        # Copy certificates to app directory
        echo "📋 Copying certificates to app directory..."
        if [ -d "/etc/letsencrypt/live/$DOMAIN" ]; then
          sudo cp -L /etc/letsencrypt/live/$DOMAIN/fullchain.pem ./certificates/
          sudo cp -L /etc/letsencrypt/live/$DOMAIN/privkey.pem ./certificates/
          sudo chmod 644 ./certificates/fullchain.pem
          sudo chmod 600 ./certificates/privkey.pem
          sudo chown $USER:$USER ./certificates/*
          echo "✅ Certificates copied to ./certificates/"
        else
          echo "⚠️ No certificates found, will use HTTP only"
        fi
        
        # Step 4: Deploy with Docker Compose
        echo ""
        echo "🐳 STEP 4: DEPLOYING WITH DOCKER COMPOSE"
        echo "----------------------------------------"
        
        # Stop and remove existing containers
        echo "Stopping existing containers..."
        docker-compose down 2>/dev/null || true
        
        # Start all services
        echo "Starting containers..."
        docker-compose up -d
        
        # Wait for database to be ready
        echo "⏳ Waiting for database to be ready..."
        for i in {1..30}; do
          if docker-compose exec mysql mysqladmin ping -h localhost --silent; then
            echo "✅ Database is ready"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "⚠️ Database not ready after 30 seconds, continuing anyway"
          fi
          sleep 1
        done
        
        # Step 5: Run database migrations
        echo ""
        echo "🛠️ STEP 5: RUNNING DATABASE MIGRATIONS"
        echo "----------------------------------------"
        
        # Wait for backend to start
        echo "Waiting for backend to start..."
        sleep 20
        
        # Run migrations
        echo "Running database migrations..."
        if docker-compose exec backend npx prisma migrate deploy; then
          echo "✅ Database migrations completed successfully"
        else
          echo "⚠️ Database migrations failed, trying alternative..."
          
          # Try alternative approach
          docker-compose exec backend npx prisma db push --accept-data-loss || \
          docker-compose exec backend npm run migrate || \
          echo "⚠️ All migration attempts failed"
        fi
        
        # Step 6: Setup HTTPS in Nginx container
        echo ""
        echo "🌐 STEP 6: CONFIGURING HTTPS IN NGINX"
        echo "----------------------------------------"
        
        # Create a script to run inside nginx container
        cat > setup_nginx_ssl.sh << 'NGINX_SCRIPT'
        #!/bin/sh
        
        DOMAIN="$1"
        
        echo "Setting up SSL in Nginx container..."
        
        # Create letsencrypt directory structure
        mkdir -p /etc/letsencrypt/live/$DOMAIN
        
        # Copy certificates if they exist
        if [ -f /etc/nginx/ssl/fullchain.pem ]; then
          cp /etc/nginx/ssl/fullchain.pem /etc/letsencrypt/live/$DOMAIN/
          cp /etc/nginx/ssl/privkey.pem /etc/letsencrypt/live/$DOMAIN/
          echo "Certificates copied to Nginx container"
        else
          echo "No certificates found in /etc/nginx/ssl"
        fi
        
        # Test nginx configuration
        nginx -t && echo "Nginx configuration is valid" || echo "Nginx configuration error"
        NGINX_SCRIPT
        
        chmod +x setup_nginx_ssl.sh
        
        # Copy script to nginx container and execute
        docker cp setup_nginx_ssl.sh nginx:/tmp/setup_nginx_ssl.sh
        docker exec nginx sh /tmp/setup_nginx_ssl.sh "$DOMAIN"
        docker exec nginx rm /tmp/setup_nginx_ssl.sh
        rm -f setup_nginx_ssl.sh
        
        # Reload nginx
        echo "Reloading Nginx configuration..."
        docker exec nginx nginx -s reload 2>/dev/null || true
        
        # Step 7: Verify deployment
        echo ""
        echo "✅ STEP 7: VERIFICATION"
        echo "----------------------------------------"
        
        # Wait for services
        echo "⏳ Waiting for all services to be ready..."
        sleep 30
        
        # Check container status
        echo "📊 Container Status:"
        docker-compose ps
        
        # Test HTTP (should redirect to HTTPS)
        echo ""
        echo "🌐 Testing HTTP (should redirect to HTTPS):"
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$DOMAIN || echo "000")
        echo "HTTP Status: $HTTP_STATUS"
        
        # Test HTTPS
        echo ""
        echo "🔒 Testing HTTPS:"
        HTTPS_STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" https://$DOMAIN 2>/dev/null || echo "000")
        echo "HTTPS Status: $HTTPS_STATUS"
        
        # Test backend API
        echo ""
        echo "🖥️ Testing Backend API:"
        API_STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" https://$DOMAIN/api/health 2>/dev/null || echo "000")
        echo "API Health Status: $API_STATUS"
        
        # Check database connection
        echo ""
        echo "🗄️ Testing Database Connection:"
        if docker-compose exec backend node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.\$queryRaw\`SELECT 1\`
            .then(() => console.log('Database connection: ✅ OK'))
            .catch(e => console.log('Database connection: ❌ Failed', e.message))
            .finally(() => prisma.\$disconnect());
        " 2>/dev/null; then
          echo "Database connection test completed"
        else
          echo "Database connection test failed or not configured"
        fi
        
        # Display final status
        echo ""
        echo "========================================"
        echo "🎉 DEPLOYMENT COMPLETE!"
        echo "========================================"
        echo ""
        echo "📊 SUMMARY:"
        echo "  - Code: ✅ Updated"
        echo "  - SSL: $( [ "$HTTPS_STATUS" = "200" ] && echo "✅ Working" || echo "⚠️ May need manual setup" )"
        echo "  - Database: $( [ -f ".env" ] && echo "✅ Configured" || echo "⚠️ Not configured" )"
        echo "  - Migrations: ✅ Attempted"
        echo ""
        echo "🌍 APPLICATION URLS:"
        echo "  - HTTP:  http://$DOMAIN"
        echo "  - HTTPS: https://$DOMAIN"
        echo "  - Local: http://localhost"
        echo ""
        echo "🔧 TROUBLESHOOTING:"
        echo "  - Check logs: docker-compose logs"
        echo "  - Check nginx: docker exec nginx nginx -t"
        echo "  - Check certs: ls -la ./certificates/"
        echo ""
        echo "🕐 Deployment completed at: $(date)"
        SCRIPT_EOF
        )
        
        # Base64 encode the script
        SCRIPT_B64=$(echo "$DEPLOY_SCRIPT" | base64 -w0)
        
        # Create SSM command JSON
        cat > /tmp/ssm_cmd.json << 'EOF'
        {
          "commands": [
            "#!/bin/bash",
            "set -e",
            "",
            "# Decode and execute the deployment script",
            "echo 'Starting deployment...'",
            "cd /home/ubuntu",
            "",
            "# Decode the script",
            "echo '$SCRIPT_B64' | base64 -d > /tmp/deploy_full.sh",
            "chmod +x /tmp/deploy_full.sh",
            "",
            "# Execute with parameters",
            "/tmp/deploy_full.sh \"$DOMAIN\" \"$EMAIL\" \"$DB_PASSWORD\"",
            "",
            "# Cleanup",
            "rm -f /tmp/deploy_full.sh",
            "",
            "echo 'Deployment script completed with exit code: $?'"
          ]
        }
        EOF
        
        # Send SSM command
        echo "🚀 Sending deployment command to EC2 instance: $INSTANCE_ID"
        
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters file:///tmp/ssm_cmd.json \
          --comment "Full deployment with HTTPS and DB migrations" \
          --timeout-seconds 900 \
          --output-s3-bucket-name "${{ secrets.S3_LOG_BUCKET || '' }}" \
          --output-s3-key-prefix "deployments/"
        
        echo "✅ Deployment command sent successfully"
        
        # Cleanup
        rm -f /tmp/ssm_cmd.json