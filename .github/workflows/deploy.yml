name: Deploy Application

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
    
    - name: Run SSM Deploy Command
      env:
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        DOMAIN: ${{ secrets.DOMAIN }}
        EMAIL: ${{ secrets.EMAIL }}
      run: |
        # Create a simple JSON file with commands
        cat > ssm_commands.json << 'EOF'
        {
          "commands": [
            "#!/bin/bash",
            "set -e",
            "",
            "echo '🚀 Starting deployment'",
            "cd /home/ubuntu",
            "",
            "# Update or clone the code",
            "if [ -d \"app/.git\" ]; then",
            "  cd app",
            "  git fetch origin",
            "  git checkout release",
            "  git pull origin release",
            "else",
            "  git clone -b release https://github.com/abdellah-archtouy/UrawsAssessment.git app",
            "  cd app",
            "fi",
            "",
            "# Deploy with Docker Compose",
            "echo '🐳 Building and starting containers...'",
            "docker compose down 2>/dev/null || true",
            "docker compose up -d --build",
            "",
            "# Wait for services to be ready",
            "echo '⏳ Waiting for services...'",
            "sleep 30",
            "",
            "# Setup HTTPS if certbot is available",
            "if command -v certbot >/dev/null 2>&1; then",
            "  echo '🔐 Setting up SSL...'",
            "  certbot --nginx \\",
            "    -d \"$DOMAIN\" \\",
            "    -d \"www.$DOMAIN\" \\",
            "    --non-interactive \\",
            "    --agree-tos \\",
            "    --email \"$EMAIL\" \\",
            "    --redirect \\",
            "    --keep-until-expiring || echo 'Certbot already configured'",
            "fi",
            "",
            "# Verify deployment",
            "echo '✅ Deployment complete!'",
            "echo '📊 Container status:'",
            "docker compose ps",
            "",
            "# Test connections",
            "echo '🔍 Testing endpoints...'",
            "curl -s -o /dev/null -w 'HTTP: %{http_code}\\n' http://localhost || echo 'HTTP test failed'",
            "curl -s -o /dev/null -w 'HTTPS: %{http_code}\\n' https://localhost 2>/dev/null || echo 'HTTPS test failed (may not be configured)'"
          ]
        }
        EOF
        
        # Replace environment variables in the JSON file
        sed -i "s/\$DOMAIN/$DOMAIN/g" ssm_commands.json
        sed -i "s/\$EMAIL/$EMAIL/g" ssm_commands.json
        
        echo "📤 Sending deployment command to EC2 instance: $INSTANCE_ID"
        
        # Send SSM command
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters file://ssm_commands.json \
          --comment "Deployment triggered by GitHub Actions" \
          --timeout-seconds 600
        
        echo "✅ Deployment command sent successfully"
        
        # Cleanup
        rm -f ssm_commands.json