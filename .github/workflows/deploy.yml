name: Production Deploy

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",

              "# 1️⃣ Bootstrap repo (once)",
              "cd /home/ubuntu",
              "if [ ! -d repo ]; then git clone https://github.com/abdellah-archtouy/UrawsAssessment.git repo; fi",
              "cd repo",
              "git fetch origin",

              "# 2️⃣ Sync deploy logic from release",
              "git checkout release -- deploy",
              "rm -rf /home/ubuntu/deploy",
              "mv deploy /home/ubuntu/deploy",
              "chmod +x /home/ubuntu/deploy/deploy.sh",

              "# 3️⃣ Sync app code from main",
              "git checkout main",
              "git pull origin main",

              "# 4️⃣ Run deploy",
              "/home/ubuntu/deploy/deploy.sh"
            ]'
