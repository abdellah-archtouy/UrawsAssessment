name: Deploy to EC2

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_rebuild:
        description: 'Force rebuild Docker images'
        required: false
        default: false
        type: boolean

env:
  DOCKER_COMPOSE_VERSION: 'v2.20.2'
  MAX_RETRIES: 3
  DEPLOY_TIMEOUT: 600 # 10 minutes

jobs:
  preflight-checks:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-environment.outputs.environment }}
      release_id: ${{ steps.set-environment.outputs.release_id }}
      deployment_mode: ${{ steps.check-ssm.outputs.deployment_mode }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment variables
        id: set-environment
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi
          
          RELEASE_ID="${ENVIRONMENT}-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}"
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "Deploying to: $ENVIRONMENT"
          echo "Release ID: $RELEASE_ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check SSM connectivity
        id: check-ssm
        run: |
          echo "🔍 Checking SSM connectivity..."
          
          # Check if instance exists and is running
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || echo "NotFound")
          
          if [[ "$INSTANCE_STATE" != "running" ]]; then
            echo "❌ EC2 instance is not running (State: $INSTANCE_STATE)"
            echo "deployment_mode=ssh" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check SSM agent status
          SSM_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text 2>/dev/null || echo "Unavailable")
          
          echo "SSM Ping Status: $SSM_STATUS"
          
          if [[ "$SSM_STATUS" == "Online" ]]; then
            echo "✅ SSM is available"
            echo "deployment_mode=ssm" >> $GITHUB_OUTPUT
          else
            echo "⚠️ SSM is not available, falling back to SSH"
            echo "deployment_mode=ssh" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: preflight-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        id: deploy-ssm
        if: needs.preflight-checks.outputs.deployment_mode == 'ssm'
        run: |
          set -e
          
          echo "🚀 Starting SSM deployment..."
          echo "Environment: ${{ needs.preflight-checks.outputs.environment }}"
          echo "Release ID: ${{ needs.preflight-checks.outputs.release_id }}"
          
          # Create deployment script
          DEPLOY_SCRIPT=$(cat << 'EOF'
          #!/bin/bash
          set -e
          
          echo "══════════════════════════════════════════════"
          echo "🚀 Starting Deployment - $RELEASE_ID"
          echo "══════════════════════════════════════════════"
          echo "Environment:    $ENVIRONMENT"
          echo "Release ID:     $RELEASE_ID"
          echo "Branch:         $BRANCH"
          echo "Commit:         $COMMIT_SHA"
          echo "Timestamp:      $(date)"
          echo "══════════════════════════════════════════════"
          
          # Configuration
          DEPLOY_DIR="/home/ubuntu/myapp"
          RELEASES_DIR="/home/ubuntu/releases"
          LOG_FILE="/home/ubuntu/deployments/$RELEASE_ID.log"
          DOCKER_COMPOSE_FILE="$DEPLOY_DIR/docker-compose.yml"
          
          # Create directories if they don't exist
          mkdir -p "$RELEASES_DIR"
          mkdir -p "/home/ubuntu/deployments"
          mkdir -p "$DEPLOY_DIR"
          
          # Start logging
          exec > >(tee -a "$LOG_FILE") 2>&1
          
          # Function to rollback on error
          rollback() {
            echo "❌ DEPLOYMENT FAILED - Attempting rollback..."
            
            if [ -d "$RELEASES_DIR/myapp-$RELEASE_ID" ]; then
              echo "↩️ Rolling back to previous version..."
              rm -rf "$DEPLOY_DIR"
              cp -r "$RELEASES_DIR/myapp-$RELEASE_ID" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              
              echo "🛑 Stopping current containers..."
              docker compose down || true
              
              echo "🚀 Starting previous containers..."
              docker compose up -d || true
              
              echo "✅ Rollback completed"
            else
              echo "⚠️ No backup available for rollback"
            fi
            
            exit 1
          }
          
          trap rollback ERR
          
          echo "[1/8] 📊 System check..."
          echo "• Disk usage: $(df -h /home | tail -1)"
          echo "• Memory: $(free -h | grep Mem | awk '{print $3"/"$2}')"
          echo "• Docker: $(docker --version)"
          echo "• Docker Compose: $(docker compose version)"
          
          echo "[2/8] 💾 Creating backup..."
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          if [ -d "$DEPLOY_DIR" ]; then
            BACKUP_DIR="$RELEASES_DIR/myapp-$RELEASE_ID"
            cp -r "$DEPLOY_DIR" "$BACKUP_DIR"
            echo "✅ Backup created: $BACKUP_DIR"
            
            # Clean old backups (keep last 5)
            echo "🧹 Cleaning old backups..."
            ls -dt $RELEASES_DIR/myapp-* | tail -n +6 | xargs rm -rf 2>/dev/null || true
          else
            echo "⚠️ No existing deployment to backup"
          fi
          
          echo "[3/8] 📥 Cloning/updating repository..."
          if [ -d "$DEPLOY_DIR/.git" ]; then
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard origin/$BRANCH
            git clean -fdx
            echo "✅ Repository updated from origin/$BRANCH"
          else
            rm -rf "$DEPLOY_DIR"
            git clone -b $BRANCH $REPO_URL "$DEPLOY_DIR"
            echo "✅ Repository cloned"
          fi
          
          cd "$DEPLOY_DIR"
          
          echo "[4/8] 📦 Setting up environment..."
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
            echo "✅ Created .env file from example"
          fi
          
          # Update environment variables if needed
          echo "ENVIRONMENT=$ENVIRONMENT" >> .env 2>/dev/null || true
          echo "RELEASE_ID=$RELEASE_ID" >> .env 2>/dev/null || true
          
          echo "[5/8] 🐳 Building/Pulling Docker images..."
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "🔨 Force rebuilding images..."
            docker compose build --no-cache
          else
            docker compose pull || docker compose build
          fi
          
          echo "[6/8] 🛑 Stopping old containers..."
          docker compose down --remove-orphans --timeout 30 || true
          
          echo "[7/8] 🚀 Starting new containers..."
          docker compose up -d
          
          echo "[8/8] 🔍 Health checks..."
          sleep 10
          
          # Check if containers are running
          RUNNING_CONTAINERS=$(docker compose ps --services --filter "status=running" | wc -l)
          TOTAL_CONTAINERS=$(docker compose ps --services | wc -l)
          
          echo "• Running containers: $RUNNING_CONTAINERS/$TOTAL_CONTAINERS"
          docker compose ps
          
          # Simple health check
          echo "🧪 Performing health check..."
          if [ $RUNNING_CONTAINERS -eq $TOTAL_CONTAINERS ]; then
            echo "✅ All containers are running"
          else
            echo "⚠️ Some containers may not be running properly"
            docker compose logs --tail=20
          fi
          
          echo "[9/9] 🧹 Cleaning up..."
          docker system prune -f --filter "until=24h" || true
          
          echo "══════════════════════════════════════════════"
          echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "══════════════════════════════════════════════"
          echo "• Release: $RELEASE_ID"
          echo "• Log file: $LOG_FILE"
          echo "• Backup: $BACKUP_DIR"
          echo "• Deployed at: $(date)"
          echo "══════════════════════════════════════════════"
          EOF
          )
          
          # Send command via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$DEPLOY_SCRIPT],environment=[ENVIRONMENT=${{ needs.preflight-checks.outputs.environment }},RELEASE_ID=${{ needs.preflight-checks.outputs.release_id }},BRANCH=${{ github.ref_name }},COMMIT_SHA=${{ github.sha }},REPO_URL=https://github.com/${{ github.repository }},FORCE_REBUILD=${{ github.event.inputs.force_rebuild || false }}]" \
            --comment "Deploy ${{ needs.preflight-checks.outputs.environment }} - ${{ needs.preflight-checks.outputs.release_id }}" \
            --timeout-seconds 600 \
            --max-concurrency "1" \
            --max-errors "1" \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for SSM command completion
        if: needs.preflight-checks.outputs.deployment_mode == 'ssm'
        run: |
          echo "⏳ Waiting for SSM command to complete..."
          
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy-ssm.outputs.COMMAND_ID }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Checking...")
            
            echo "Status: $STATUS (attempt $i/120)"
            
            case $STATUS in
              "Success")
                echo ""
                echo "✅ Deployment successful!"
                echo ""
                echo "📋 Deployment output:"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy-ssm.outputs.COMMAND_ID }}" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              "Failed" | "Cancelled" | "TimedOut")
                echo ""
                echo "❌ Deployment failed with status: $STATUS"
                echo ""
                echo "🔍 Error details:"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.deploy-ssm.outputs.COMMAND_ID }}" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
            esac
            
            sleep 5
          done
          
          echo "❌ Deployment timed out after 10 minutes"
          
          # Get command details for debugging
          echo "📋 Command details:"
          aws ssm list-commands \
            --command-id "${{ steps.deploy-ssm.outputs.COMMAND_ID }}" \
            --query 'Commands[0]' || true
          
          exit 1

      - name: Deploy via SSH
        id: deploy-ssh
        if: needs.preflight-checks.outputs.deployment_mode == 'ssh'
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            
            echo "══════════════════════════════════════════════"
            echo "🚀 Starting SSH Deployment"
            echo "══════════════════════════════════════════════"
            
            # Configuration
            ENVIRONMENT="${{ needs.preflight-checks.outputs.environment }}"
            RELEASE_ID="${{ needs.preflight-checks.outputs.release_id }}"
            BRANCH="${{ github.ref_name }}"
            COMMIT_SHA="${{ github.sha }}"
            DEPLOY_DIR="/home/ubuntu/myapp"
            RELEASES_DIR="/home/ubuntu/releases"
            LOG_FILE="/home/ubuntu/deployments/$RELEASE_ID.log"
            
            # Create directories
            mkdir -p "$RELEASES_DIR"
            mkdir -p "/home/ubuntu/deployments"
            
            # Start logging
            exec > >(tee -a "$LOG_FILE") 2>&1
            
            echo "[1/8] 📊 System check..."
            df -h /home
            free -h
            docker --version
            docker compose version
            
            echo "[2/8] 💾 Creating backup..."
            if [ -d "$DEPLOY_DIR" ]; then
              BACKUP_DIR="$RELEASES_DIR/myapp-$RELEASE_ID"
              cp -r "$DEPLOY_DIR" "$BACKUP_DIR"
              echo "✅ Backup created"
              
              # Clean old backups
              ls -dt $RELEASES_DIR/myapp-* | tail -n +6 | xargs rm -rf 2>/dev/null || true
            fi
            
            echo "[3/8] 📥 Cloning/updating repository..."
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git fetch origin
              git reset --hard origin/$BRANCH
              git clean -fdx
            else
              rm -rf "$DEPLOY_DIR"
              git clone -b $BRANCH https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"
            
            echo "[4/8] 📦 Setting up environment..."
            [ -f ".env.example" ] && [ ! -f ".env" ] && cp .env.example .env
            echo "ENVIRONMENT=$ENVIRONMENT" >> .env 2>/dev/null || true
            
            echo "[5/8] 🐳 Building Docker images..."
            docker compose build --no-cache
            
            echo "[6/8] 🛑 Stopping old containers..."
            docker compose down --remove-orphans || true
            
            echo "[7/8] 🚀 Starting new containers..."
            docker compose up -d
            
            echo "[8/8] 🔍 Health checks..."
            sleep 10
            docker compose ps
            
            echo "✅ Deployment completed via SSH"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # You can add health checks here, for example:
          # curl -f http://your-app-url/health || true
          
          echo "✅ Verification step completed"

  post-deploy:
    needs: [preflight-checks, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Configure AWS credentials
        if: needs.preflight-checks.outputs.deployment_mode == 'ssm'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deployment Summary
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════"
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "🎉 DEPLOYMENT SUCCESSFUL"
          else
            echo "❌ DEPLOYMENT FAILED"
          fi
          echo "══════════════════════════════════════════════════════"
          echo "Environment:    ${{ needs.preflight-checks.outputs.environment }}"
          echo "Release ID:     ${{ needs.preflight-checks.outputs.release_id }}"
          echo "Deployment Mode: ${{ needs.preflight-checks.outputs.deployment_mode }}"
          echo "Branch:         ${{ github.ref_name }}"
          echo "Commit:         ${{ github.sha }}"
          echo "Triggered by:   ${{ github.actor }}"
          echo "Trigger:        ${{ github.event_name }}"
          echo "Timestamp:      $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "══════════════════════════════════════════════════════"
          echo ""
          
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "📝 Rollback command:"
            echo "   ssh ubuntu@<EC2_HOST> 'cd /home/ubuntu/releases && ls -lat myapp-*'"
            echo ""
            echo "🔄 Restart command:"
            echo "   ssh ubuntu@<EC2_HOST> 'cd /home/ubuntu/myapp && docker compose restart'"
          fi

      - name: Send notification on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const { repository, sha, ref } = context;
            const commitUrl = `https://github.com/${repository}/commit/${sha}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ Deployment failed for ${ref}\n\nCommit: ${commitUrl}\n\nCheck the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "🧹 Cleaning up on failure..."
          # Add any cleanup steps here