name: Full Deploy Application

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DOMAIN: ${{ secrets.DOMAIN || 'aarchtou.me' }}
          EMAIL: ${{ secrets.EMAIL || 'admin@aarchtou.me' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'rootpassword' }}
          MAIN_BRANCH: "main"
        run: |
          echo "📤 Sending deployment command to EC2..."

          DEPLOY_SCRIPT=$(cat << 'EOF'
          #!/bin/bash
          set -e

          DOMAIN="$1"
          EMAIL="$2"
          DB_PASSWORD="$3"
          MAIN_BRANCH="$4"

          cd /home/ubuntu

          echo "🚀 Pulling latest code from main branch..."
          if [ -d "app/.git" ]; then
              cd app
              git fetch origin
              git checkout $MAIN_BRANCH
              git pull origin $MAIN_BRANCH
          else
              git clone -b $MAIN_BRANCH https://github.com/abdellah-archtouy/UrawsAssessment.git app
              cd app
          fi

          echo "✅ Code is up to date"

          # Create directories
          mkdir -p ./certificates ./certbot/www ./nginx

          # Create .env
          cat > .env << ENV_EOF
          DATABASE_URL=mysql://root:${DB_PASSWORD}@mysql:3306/userdb
          PORT=5000
          NODE_ENV=production
          CORS_ORIGIN=*
          ENV_EOF
          echo "✅ Environment file created"

          # Install certbot if missing
          if ! command -v certbot >/dev/null 2>&1; then
              sudo apt update
              sudo apt install -y certbot python3-certbot-nginx
              echo "✅ Certbot installed"
          fi

          # Stop previous containers
          echo "🐳 Stopping previous containers..."
          docker compose down || true

          # Obtain SSL certificate
          echo "🔐 Requesting SSL certificate for $DOMAIN..."
          if sudo certbot certonly --standalone -d "$DOMAIN" -d "www.$DOMAIN" --non-interactive --agree-tos --email "$EMAIL" --force-renewal; then
              echo "✅ SSL certificate obtained"
              sudo cp -L /etc/letsencrypt/live/$DOMAIN/fullchain.pem ./certificates/
              sudo cp -L /etc/letsencrypt/live/$DOMAIN/privkey.pem ./certificates/
              sudo chmod 644 ./certificates/fullchain.pem
              sudo chmod 600 ./certificates/privkey.pem
          else
              echo "⚠️ Could not obtain SSL certificate"
          fi

          # Start Docker Compose containers
          echo "🐳 Starting Docker Compose containers..."
          docker compose up -d --build

          # Verify container status
          echo "📊 Container status:"
          docker compose ps

          # Test endpoints
          echo "🌐 Testing endpoints..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$DOMAIN || echo "failed")
          HTTPS_STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" https://$DOMAIN || echo "failed")
          echo "HTTP Status: $HTTP_STATUS"
          echo "HTTPS Status: $HTTPS_STATUS"

          echo "✅ Deployment finished successfully"
          EOF
          )

          SCRIPT_B64=$(echo "$DEPLOY_SCRIPT" | base64 -w0)

          cat > /tmp/ssm_cmd.json << SSM_EOF
          {
            "commands": [
              "#!/bin/bash",
              "set -e",
              "echo 'Starting full deployment setup...'",
              "echo '$SCRIPT_B64' | base64 -d > /tmp/deploy_full.sh",
              "chmod +x /tmp/deploy_full.sh",
              "/tmp/deploy_full.sh \"$DOMAIN\" \"$EMAIL\" \"$DB_PASSWORD\" \"$MAIN_BRANCH\"",
              "rm -f /tmp/deploy_full.sh",
              "echo 'Deployment completed'"
            ]
          }
          SSM_EOF

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_cmd.json \
            --comment "Full App Deployment" \
            --timeout-seconds 900

          echo "✅ Deployment command sent to EC2"
          rm -f /tmp/ssm_cmd.json
